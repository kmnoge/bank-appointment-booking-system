services:
  api:
    build:
      context: ./backend/BankAppointments.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Bookings: "Server=db,1433;Database=BankAppointments;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Cors__AllowedOrigins__0: "http://localhost:8082"
      BranchAdmin__ApiKey: "${BRANCH_ADMIN_API_KEY:?Set BRANCH_ADMIN_API_KEY in .env}"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["8082:8080"]
    depends_on: [api]
    restart: unless-stopped
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}"
    volumes: ["sql_data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  sql_data:
  redis_data:
